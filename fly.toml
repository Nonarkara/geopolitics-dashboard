app = 'geopolitics-dashboard'
primary_region = 'sin'

[build]

[env]
  PORT = '3000'
  NODE_ENV = 'production'
  HOSTNAME = '0.0.0.0'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
