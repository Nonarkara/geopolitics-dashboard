databases:
  - name: geopolitics-dashboard-db
    databaseName: geopolitics_dashboard
    user: geopolitics_dashboard
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: geopolitics-dashboard
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: geopolitics-dashboard-db
          property: connectionString
      - key: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: REFERENCE_DASHBOARD_URL
        value: https://geopolitics-dashboard.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OLLAMA_HOST
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen2.5-coder:7b
      - key: AI_REQUEST_TIMEOUT_MS
        value: "5000"
      - key: ENABLE_AI_SUMMARIES
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_DATA_EXPLORER
        value: "false"
      - key: DATA_EXPLORER_ENABLED
        value: "false"
      - key: DATA_EXPLORER_TOKEN
        generateValue: true
      - key: ALLOW_MOCK_INGESTION
        value: "false"
      - key: INGEST_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: FIRMS_KEY
        sync: false
      - key: ACLED_USERNAME
        sync: false
      - key: ACLED_PASSWORD
        sync: false
      - key: ACLED_EMAIL
        sync: false
      - key: ACLED_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://qbatksnulitgrhigzbta.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: cron
    name: geopolitics-acled-ingest
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "0 */6 * * *"
    buildCommand: pip install -r ingestion/requirements.txt
    startCommand: python ingestion/acled_ingest.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geopolitics-dashboard-db
          property: connectionString
      - key: ACLED_USERNAME
        sync: false
      - key: ACLED_PASSWORD
        sync: false
      - key: ACLED_EMAIL
        sync: false
      - key: ACLED_KEY
        sync: false
      - key: ALLOW_MOCK_INGESTION
        value: "false"
      - key: INGEST_REQUEST_TIMEOUT_SECONDS
        value: "30"

  - type: cron
    name: geopolitics-firms-ingest
