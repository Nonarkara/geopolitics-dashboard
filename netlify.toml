[build]
  command = "npm run build"
  publish = ".next"

# Next.js 16 runtime adapter
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment: all functions are on-demand only (no background compute)
# The dashboard only uses serverless functions when a user visits.
# Database ingestion runs independently on Render cron jobs.
[functions]
  node_bundler = "esbuild"

# Redirect API routes to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/___netlify-server-handler/api/:splat"
  status = 200
  force = true

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Static assets cache for 1 year (Next.js already hashes filenames)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
